<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Мобильный лендинг</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="landing">
      <header class="hero">
        <h1 class="hero__title">Твоя выгода стартует прямо здесь сейчас</h1>
        <img
          class="hero__icon"
          src="https://example.com/app-icon.png"
          alt="Иконка приложения"
        />
      </header>

      <p class="landing__description">
        Получите доступ к специальному предложению сегодня: откройте страницу, следуйте двум шагам и закрепите скидку до завершения обратного отсчёта.
      </p>

      <section class="timer" aria-live="polite">
        <p class="timer__label">До окончания предложения осталось</p>
        <div id="countdown" class="timer__value">05:00</div>
      </section>

      <ul class="steps">
        <li>step1</li>
        <li>step2</li>
      </ul>

      <button class="cta" type="button">Продолжить</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
